name: "\uD83C\uDF4F Build & Deploy iOS to TestFlight"

on:
  push:
    branches:
      - develop
  workflow_dispatch:

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ios:
    name: Build iOS and Submit to TestFlight
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install Dependencies
        run: npm ci

      - name: Verify EAS Authentication
        run: eas whoami

      - name: Verify Project Configuration
        run: |
          echo "Checking app.json projectId..."
          PROJECT_ID=$(node -e "console.log(require('./app.json').expo.extra.eas.projectId)")
          OWNER=$(node -e "console.log(require('./app.json').expo.owner || 'NOT SET')")
          echo "Project ID: $PROJECT_ID"
          echo "Owner: $OWNER"
          if [ "$OWNER" != "profzen" ]; then
            echo "::error::app.json owner must be 'profzen' to match EXPO_TOKEN. Current: $OWNER"
            exit 1
          fi
          if [ "$PROJECT_ID" != "cb443e23-61ff-47de-8f7d-45919575a57d" ]; then
            echo "::error::app.json projectId does not match @profzen project. Current: $PROJECT_ID"
            exit 1
          fi
          echo "Configuration verified successfully!"

      - name: Build iOS and Submit to TestFlight
        env:
          EAS_BUILD_NO_EXPO_GO_WARNING: true
        run: |
          eas build \
            --platform ios \
            --profile production \
            --auto-submit \
            --non-interactive

      - name: Build Summary
        if: always()
        run: |
          echo "## 🍏 iOS Build & TestFlight Submission" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Detail | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Platform | iOS |" >> $GITHUB_STEP_SUMMARY
          echo "| Profile | Production |" >> $GITHUB_STEP_SUMMARY
          echo "| Bundle ID | com.dizzitup.app |" >> $GITHUB_STEP_SUMMARY
          echo "| ASC App ID | 6799749556 |" >> $GITHUB_STEP_SUMMARY
          echo "| Auto-Submit | TestFlight |" >> $GITHUB_STEP_SUMMARY
          echo "| Auto-Increment | Build Number |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📱 [View on TestFlight](https://appstoreconnect.apple.com/apps/6799749556/testflight/ios)" >> $GITHUB_STEP_SUMMARY
