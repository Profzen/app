name: 🍏 Build & Deploy iOS to TestFlight

on:
  push:
    branches:
      - develop
  workflow_dispatch:

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ios:
    name: 📱 Build iOS & Submit to TestFlight
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: ⚡ Setup EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 🏗️ Build iOS & Submit to TestFlight
        run: |
          echo "🚀 Starting iOS production build with auto-submit to TestFlight..."
          eas build \
            --platform ios \
            --profile production \
            --auto-submit \
            --non-interactive

      - name: 📊 Build Summary
        if: always()
        run: |
          echo "## 🍏 iOS Build & TestFlight Submission" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Detail | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Platform | iOS |" >> $GITHUB_STEP_SUMMARY
          echo "| Profile | Production |" >> $GITHUB_STEP_SUMMARY
          echo "| Bundle ID | com.dizzitup.app |" >> $GITHUB_STEP_SUMMARY
          echo "| ASC App ID | 6799749556 |" >> $GITHUB_STEP_SUMMARY
          echo "| Auto-Submit | ✅ TestFlight |" >> $GITHUB_STEP_SUMMARY
          echo "| Auto-Increment | ✅ Build Number |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "🔗 [View on TestFlight](https://appstoreconnect.apple.com/apps/6799749556/testflight/ios)" >> $GITHUB_STEP_SUMMARY
