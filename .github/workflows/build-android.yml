name: Build and Deploy Android to Play Store

on:
  push:
    branches:
      - develop
  workflow_dispatch:

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    name: Build Android and Submit to Play Store
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install Dependencies
        run: npm ci

      - name: Verify EAS Authentication
        run: eas whoami

      - name: Build Android and Submit to Play Store
        env:
          EAS_BUILD_NO_EXPO_GO_WARNING: true
        run: |
          eas build \
            --platform android \
            --profile production \
            --auto-submit \
            --non-interactive

      - name: Build Summary
        if: always()
        run: |
          echo "##  Android Build & Play Store Submission" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Detail | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Platform | Android |" >> $GITHUB_STEP_SUMMARY
          echo "| Profile | Production |" >> $GITHUB_STEP_SUMMARY
          echo "| Track | Internal Testing |" >> $GITHUB_STEP_SUMMARY
          echo "| Auto-Submit | Google Play |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo " [View on Google Play Console](https://play.google.com/console/)" >> $GITHUB_STEP_SUMMARY
