name: Build Android APK

on:
  push:
    branches:
      - main
      - develop
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android APK File
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: ☕ Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 📱 Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: 📦 Install Node Dependencies
        run: npm ci

      - name: ⚡ Generate Android Project (Expo Prebuild)
        run: npx expo prebuild --platform android --clean

      - name: 🔑 Set Executable Permission for Gradlew
        run: chmod +x android/gradlew

      - name: 🏗️ Build Android APK (Gradle)
        run: |
          cd android
          ./gradlew assembleRelease

      - name: 📦 Locate Compiled APK
        id: find_apk
        run: |
          APK_PATH=$(find android/app/build/outputs/apk -name "*.apk" | head -n 1)
          echo "APK_PATH=$APK_PATH" >> $GITHUB_ENV
          echo "Found APK at: $APK_PATH"

      - name: 🚀 Upload APK Artifact to GitHub
        uses: actions/upload-artifact@v4
        with:
          name: DizzitUp-Android-APK
          path: ${{ env.APK_PATH }}
          retention-days: 30
